<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot de Vestibulares - Pietra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h2>Tire suas dúvidas sobre Vestibulares 🎓</h2>
      <p>Com a Pietra</p>
    </header>

    <div id="chat-box" class="chat-box"></div>

    <div class="chat-input-area">
      <input type="password" id="api-key" placeholder="Cole sua API Key do Gemini aqui..." />
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Pergunte sobre vest, cronogramas, matérias..." />
        <button id="send-btn">Enviar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
